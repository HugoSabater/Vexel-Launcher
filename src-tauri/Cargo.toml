[package]
name = "mc-launcher-rust"
version = "1.1.0"
description = "Vexel Launcher — Launcher ligero y optimizado para Minecraft"
authors = ["Hugo Sabater"]
edition = "2021"
default-run = "vexel-launcher"

[lib]
name = "mc_launcher_rust_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "vexel-launcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "process", "sync", "rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
sysinfo = "0.33"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v3", "v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
directories = "5"
futures-util = "0.3"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_System_Registry", "Win32_Security"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
